name: Korsche Frame

on:
  schedule:
    - cron: '0 0 * * *'  # Runs once a day at midnight
  workflow_dispatch:  # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      
      - name: Run scratch
        run: python src/frame.py ${{ github.event.inputs.reference_image }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

      - name: Move to frame directory
        run: mv images frame

      - name: Display logs
        run: cat $(ls frame/frame_* | tail -n 1)

      - name: List generated images
        run: ls frame/

      - name: upload to s3
        run: ls frame/ | xargs -I {} python src/upload.py frame/{}
        env:
          AWS_REGION: 'us-east-1'
          UPLOADER_AWS_ACCESS_KEY: ${{ secrets.UPLOADER_AWS_ACCESS_KEY }}
          UPLOADER_AWS_SECRET_KEY: ${{ secrets.UPLOADER_AWS_SECRET_KEY }}
          UPLOADER_S3_BUCKET: ${{ vars.UPLOADER_S3_BUCKET }}
